name: Release

on:
    workflow_run:
        branches:
            - master
        workflows:
            - CI
        types:
            - completed

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: false

jobs:
    release:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ${{ vars.RUNNER_LABEL }}
        timeout-minutes: 10
        steps:
            - uses: actions/create-github-app-token@v2
              id: app-token
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v6
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  ref: ${{ github.event.workflow_run.head_branch }}
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'

            - name: Install semantic-release
              run: |
                  npm install --no-save --legacy-peer-deps --ignore-scripts semantic-release \
                    @semantic-release/git \
                    @semantic-release/commit-analyzer \
                    @semantic-release/release-notes-generator \
                    @semantic-release/changelog \
                    @semantic-release/github \
                    @semantic-release/npm \
                    @google/semantic-release-replace-plugin@1.2.0

            - name: Run semantic-release
              id: semantic-release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  set -o pipefail
                  npx semantic-release --extends ./.github/semantic-release.json | tee semantic-release.log
                  VERSION=$(grep -oP 'Published release \K[^\s]+(?= on)' semantic-release.log || true)
                  if [ -n "$VERSION" ]; then
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "## :rocket: Released version $VERSION" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "## No new release published" >> "$GITHUB_STEP_SUMMARY"
                  fi
